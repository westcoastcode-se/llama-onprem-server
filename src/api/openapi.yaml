openapi: 3.0.3
info:
  title: Callisto server
  version: 1.0.0
  description: |
    HTTP API for `callisto`. One loaded model generates text. Codex CLI and
    Copilot CLI use `POST /v1/responses` (`wire_api = "responses"`). The server does
    not execute tools. It returns `function_call` items, and the client runs them.

    Copilot's default wire is Chat Completions. Set `COPILOT_PROVIDER_WIRE_API=responses`
    and `COPILOT_PROVIDER_BASE_URL` to a URL that ends in `/v1`.

    Authentication is off unless `--api-key`, the config key `api-key`, or
    `CALLISTO_API_KEY` sets a key. The flag and the file win over the environment
    variable. When a key is set, every route except `GET /health` requires
    `Authorization: Bearer <key>`. A missing or wrong key is `401` with
    `{"error":{"message":"invalid api key","type":"invalid_request_error","code":"invalid_api_key"}}`.

    The process binds `127.0.0.1:8080` unless `--host` and `-p` / `--port` say otherwise.
servers:
  - url: http://127.0.0.1:8080
    description: Default bind address
tags:
  - name: health
  - name: responses
  - name: models
paths:
  /health:
    get:
      tags: [health]
      operationId: health
      summary: Liveness check
      description: This route does not check the API key.
      responses:
        "200":
          description: Process is accepting connections.
          content:
            text/plain:
              schema:
                type: string
                enum: ["OK"]
              example: OK

  /v1/models:
    get:
      tags: [models]
      operationId: listModels
      summary: List the loaded model
      description: |
        One entry. `id` is the GGUF file name without the directory or the `.gguf` suffix.
        `GET /models` is the same list. Codex does not fill its model picker from this route.
      responses:
        "200":
          description: The loaded model.
          content:
            application/json:
              schema:
                type: object
                required: [object, data]
                properties:
                  object:
                    type: string
                    enum: [list]
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, object, owned_by]
                      properties:
                        id:
                          type: string
                        object:
                          type: string
                          enum: [model]
                        owned_by:
                          type: string
                          enum: [callisto]
              example:
                object: list
                data:
                  - id: Qwen3.8-27B
                    object: model
                    owned_by: callisto
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/responses:
    post:
      tags: [responses]
      operationId: createResponse
      summary: Generate one Responses turn
      description: |
        OpenAI Responses API used by Codex CLI and by Copilot CLI when its wire is
        `responses`. `POST /responses` is the same handler.

        `input` is a string or an array of items (`message`, `reasoning`, `function_call`,
        `function_call_output`, `tool_search_call`, `tool_search_output`, and the
        custom-tool equivalents). `instructions` is system text. `developer` messages
        are folded into that text. A reasoning item with empty content and an empty
        summary is skipped, unless `encrypted_content` is plain text rather than a
        ciphertext blob. `previous_response_id` is ignored.

        Tools of type `function` and `custom` are passed to the model. A `namespace`
        tool is flattened to `namespace.member`. The matching `function_call` is
        returned with the leaf `name` and a `namespace` field. `tool_search` is a
        function named `tool_search` when the request omits a name. Hosted tools such
        as `web_search` are skipped. A `function_call` item may carry `namespace`
        separately from `name`; the server joins them for the prompt. Image, audio,
        and file inputs are rejected.

        `prompt_cache_key` selects the KV slot. Letters, digits, `.`, `_`, and `-` are
        kept. Anything else becomes `_`. The name is at most 120 characters. With no key
        the slot is `codex`.

        `stream: true` returns `text/event-stream`. The events Codex reads are
        `response.created`, `response.output_text.delta`, `response.reasoning_text.delta`,
        `response.output_item.done`, and `response.completed`. A function call also emits
        `response.output_item.added`, `response.function_call_arguments.delta`, and
        `response.function_call_arguments.done` before `response.output_item.done`.
        Cancel sends `response.incomplete` with `incomplete_details.reason` `interrupted`.
        Failure sends `response.failed`.

        `stream: false` returns the completed response object, or `500` when generation fails.
        Request errors use `{"error":{"message","type":"invalid_request_error"}}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input]
              properties:
                model:
                  type: string
                instructions:
                  type: string
                input:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: object
                tools:
                  type: array
                  items:
                    type: object
                stream:
                  type: boolean
                  default: false
                max_output_tokens:
                  type: integer
                temperature:
                  type: number
                prompt_cache_key:
                  type: string
            example:
              model: local
              instructions: Be brief.
              input: Hello
              stream: true
      responses:
        "200":
          description: Completed response object, or an event stream when `stream` is true.
        "400":
          description: The body is not a Responses request this server can run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAIError"
              example:
                error:
                  message: input is required
                  type: invalid_request_error
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          description: Generation failed. Same `error` object, with `type` `server_error`.

components:
  responses:
    Unauthorized:
      description: API key is configured and the bearer token is missing or wrong.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpenAIError"
          example:
            error:
              message: invalid api key
              type: invalid_request_error
              code: invalid_api_key
  schemas:
    OpenAIError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, type]
          properties:
            message:
              type: string
            type:
              type: string
            code:
              type: string
